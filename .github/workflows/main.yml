name: Build (verify only, no release)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version: [1_5_2, 1_8, 1_14]

    steps:
      - name: Checkout repo (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build offline download client (Eaglercraft ${{ matrix.version }})
        run: ./gradlew buildOfflineDownload_${{ matrix.version }} --stacktrace

      - name: Upload build output (for inspection only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-download-${{ matrix.version }}
          path: modules/module-eag-${{ matrix.version }}/target_teavm_javascript/javascript/*.html
          if-no-files-found: warn
          retention-days: 7
