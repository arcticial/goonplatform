name: Build my shit

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version: [1_5_2, 1_8, 1_14]

    steps:
      - name: Checkout repo (no submodules yet)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Fetch submodules at their latest commit (ignores stale pinned refs)
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --remote

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build offline download client (Eaglercraft ${{ matrix.version }})
        run: ./gradlew buildOfflineDownload_${{ matrix.version }} --stacktrace

      - name: Build integrated server (1_5_2 only)
        if: matrix.version == '1_5_2'
        working-directory: modules/module-eag-1_5_2/sp-server
        run: |
          chmod +x gradlew
          ./gradlew teavmc

      - name: Build asset pack (1_5_2 only)
        if: matrix.version == '1_5_2'
        working-directory: modules/module-eag-1_5_2/epkcompiler
        run: java -jar CompilePackage.jar "../lwjgl-rundir/resources" "../javascript/assets.epk"

      - name: Assemble offline download HTML (1_5_2 only)
        if: matrix.version == '1_5_2'
        working-directory: modules/module-eag-1_5_2
        run: |
          chmod +x ZipStableDownload.sh
          ./ZipStableDownload.sh

      - name: Upload build output (for inspection only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-download-${{ matrix.version }}
          path: |
            modules/module-eag-${{ matrix.version }}/target_teavm_javascript/javascript/*.html
            modules/module-eag-1_5_2/stable-download/Offline_Download_Version.html
          if-no-files-found: warn
          retention-days: 7
